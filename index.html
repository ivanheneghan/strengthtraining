<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ivan's Strength Programme</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Strength">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --accent: #e8ff47;
    --blue: #47b8ff;
    --text: #f0f0f0;
    --muted: #666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* HOME */
  #home { padding: 48px 24px 32px; justify-content: flex-start; gap: 0; }
  .home-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 72px; line-height: 0.9; letter-spacing: 2px; }
  .home-header h1 span { color: var(--accent); }
  .home-header p { margin-top: 12px; color: var(--muted); font-size: 14px; font-weight: 300; }

  .week-selector { margin-top: 40px; }
  .week-selector label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .week-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .week-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Bebas Neue', sans-serif; font-size: 28px; padding: 16px 8px; border-radius: 8px; cursor: pointer; text-align: center; }
  .week-btn.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  .session-buttons { margin-top: 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .session-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Bebas Neue', sans-serif; font-size: 36px; padding: 24px 8px; border-radius: 12px; cursor: pointer; text-align: center; position: relative; }
  .session-btn .s-label { display: block; font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 6px; line-height: 1.3; }
  .session-btn .s-done { display: block; font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 1px; color: var(--accent); margin-top: 4px; }
  .session-btn.s1 { border-top: 3px solid var(--accent); }
  .session-btn.s2 { border-top: 3px solid var(--blue); }
  .session-btn.s3 { border-top: 3px solid var(--accent); }
  .session-btn.locked { opacity: 0.6; }

  .home-history { margin-top: 32px; }
  .home-history-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .history-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .history-row span:first-child { color: var(--muted); font-weight: 300; }
  .history-row span:last-child { color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 16px; }
  .history-section-label { font-size: 11px; color: var(--muted); margin: 12px 0 6px; letter-spacing: 1px; }

  .nav-links { margin-top: 24px; display: flex; gap: 12px; }
  .nav-link { flex: 1; background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; padding: 12px; border-radius: 8px; cursor: pointer; }

  /* EXERCISE SCREEN */
  #exercise { padding: 0; }
  .ex-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .ex-header-left { display: flex; align-items: center; gap: 12px; }
  .back-btn { background: none; border: 1px solid var(--border); color: var(--muted); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .ex-progress { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .ex-progress strong { color: var(--accent); }
  .session-clock { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--muted); letter-spacing: 2px; }
  .week-badge { font-size: 11px; color: var(--bg); background: var(--accent); padding: 4px 10px; border-radius: 20px; font-weight: 500; letter-spacing: 1px; }

  .progress-bar { height: 2px; background: var(--border); }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }

  .ex-card { padding: 28px 20px 20px; flex: 1; }
  .ex-name { font-family: 'Bebas Neue', sans-serif; font-size: 48px; line-height: 0.95; letter-spacing: 1px; margin-bottom: 6px; }
  .ex-note { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 24px; min-height: 16px; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 10px; text-align: center; }
  .stat-box.hi { background: var(--accent); border-color: var(--accent); }
  .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1; }
  .stat-box.hi .stat-value { color: var(--bg); }
  .stat-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .stat-box.hi .stat-label { color: rgba(0,0,0,0.5); }

  .load-section { margin-bottom: 20px; }
  .load-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .load-input { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Bebas Neue', sans-serif; font-size: 28px; padding: 12px 16px; border-radius: 10px; width: 100%; outline: none; }
  .load-input:focus { border-color: var(--accent); }
  .load-input::placeholder { color: var(--muted); }

  .sets-section { margin-bottom: 24px; }
  .sets-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .sets-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .set-dot { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--muted); }
  .set-dot.done { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .cues-section { margin-bottom: 24px; }
  .cues-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .cues-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .cues-list li { font-size: 14px; font-weight: 300; color: var(--text); padding-left: 16px; position: relative; line-height: 1.5; }
  .cues-list li::before { content: '—'; position: absolute; left: 0; color: var(--accent); font-size: 12px; }

  .ex-nav { padding: 14px 20px 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid var(--border); background: var(--bg); position: sticky; bottom: 0; }
  .nav-btn { padding: 16px; border-radius: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; cursor: pointer; border: none; }
  .prev-btn { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .next-btn { background: var(--accent); color: var(--bg); }

  /* REST OVERLAY */
  .rest-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.93); z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .rest-overlay.active { display: flex; }
  .rest-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .rest-timer { font-family: 'Bebas Neue', sans-serif; font-size: 110px; color: var(--accent); line-height: 1; }
  .rest-sub { font-size: 14px; color: var(--muted); }
  .rest-skip { margin-top: 16px; background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 10px 24px; border-radius: 8px; cursor: pointer; }

  /* DONE SCREEN */
  #done { padding: 48px 24px; justify-content: center; align-items: center; text-align: center; gap: 16px; }
  .done-icon { font-size: 64px; }
  .done-title { font-family: 'Bebas Neue', sans-serif; font-size: 64px; line-height: 0.9; letter-spacing: 2px; }
  .done-title span { color: var(--accent); }
  .done-sub { color: var(--muted); font-size: 15px; font-weight: 300; max-width: 280px; line-height: 1.6; }
  .done-times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 360px; margin-top: 8px; }
  .done-time-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 8px; text-align: center; }
  .done-time-val { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--accent); line-height: 1; }
  .done-time-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .done-home-btn { margin-top: 8px; background: var(--accent); color: var(--bg); border: none; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; padding: 18px 40px; border-radius: 12px; cursor: pointer; }

  /* HISTORY SCREEN */
  #history { padding: 0; }
  .history-header { padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .history-title { font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: 0.5px; }
  #history-content { padding: 20px; }
  .history-entry { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .history-entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .history-entry-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
  .history-entry-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .history-badge { background: var(--accent); color: var(--bg); font-family: 'Bebas Neue', sans-serif; font-size: 16px; padding: 4px 10px; border-radius: 6px; }
  .history-load-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .history-load-row span:first-child { color: var(--muted); font-weight: 300; }
  .history-load-row span:last-child { color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 15px; }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <div class="home-header">
    <h1>FOUNDATIONAL<br><span>STRENGTH</span></h1>
    <p>Ivan Heneghan · Programme 1</p>
  </div>

  <div class="week-selector">
    <label>Select Week</label>
    <div class="week-grid">
      <button class="week-btn selected" onclick="selectWeek(1)">1</button>
      <button class="week-btn" onclick="selectWeek(2)">2</button>
      <button class="week-btn" onclick="selectWeek(3)">3</button>
      <button class="week-btn" onclick="selectWeek(4)">4</button>
    </div>
  </div>

  <div class="session-buttons" id="session-buttons"></div>
  <div id="home-history-container"></div>

  <div class="nav-links">
    <button class="nav-link" onclick="showHistory()">Session History</button>
  </div>
</div>

<!-- EXERCISE -->
<div class="screen" id="exercise">
  <div class="ex-header">
    <div class="ex-header-left">
      <button class="back-btn" onclick="goHome()">←</button>
      <div class="ex-progress"><strong id="ex-num">1</strong> / <span id="ex-total">6</span></div>
    </div>
    <div class="session-clock" id="session-clock">0:00</div>
    <div class="week-badge" id="week-badge">W1</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="ex-card" id="ex-card"></div>
  <div class="ex-nav">
    <button class="nav-btn prev-btn" id="prev-btn" onclick="prevEx()">← Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="nextEx()">Next →</button>
  </div>
</div>

<!-- DONE -->
<div class="screen" id="done">
  <div class="done-icon">💪</div>
  <div class="done-title">WORKOUT<br><span>DONE.</span></div>
  <p class="done-sub">Note your loads before you leave.</p>
  <div class="done-times" id="done-times"></div>
  <button class="done-home-btn" onclick="goHome()">Back to Home</button>
</div>

<!-- HISTORY -->
<div class="screen" id="history">
  <div class="history-header">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="history-title">Session History</div>
  </div>
  <div id="history-content"></div>
</div>

<!-- REST OVERLAY -->
<div class="rest-overlay" id="rest-overlay">
  <div class="rest-label">Rest</div>
  <div class="rest-timer" id="rest-timer">60</div>
  <div class="rest-sub" id="rest-sub"></div>
  <button class="rest-skip" onclick="skipRest()">Skip</button>
</div>

<script>
// ─── PROGRAMME DATA ───────────────────────────────────────────────
const WORKOUTS = {
  A: [
    {
      name: "Warm-Up",
      note: "5 mins brisk walking or light jog, then 1-2 light sets of first exercise at ~50%",
      cues: ["5 minutes brisk walking or light jog", "1-2 light sets of Goblet Squat at ~50% weight", "Get body temperature up — don't skip this"],
      rest: 0,
      weeks: [{sets:1,reps:"5 min"},{sets:1,reps:"5 min"},{sets:1,reps:"5 min"},{sets:1,reps:"5 min"}]
    },
    {
      name: "Dumbbell Goblet Squat",
      note: "",
      cues: ["Hold dumbbell vertically at chest, hands cupped", "Feet shoulder-width, toes out slightly", "Knees track over toes — don't cave in", "Chest tall, heels on floor throughout"],
      rest: 60,
      weeks: [{sets:2,reps:"10"},{sets:2,reps:"12"},{sets:3,reps:"8"},{sets:3,reps:"10"}]
    },
    {
      name: "Knee Extensions",
      note: "",
      cues: ["Pad sits just above ankle", "Knee joint aligned with machine pivot", "Extend fully at top, lower slowly", "Don't let weight crash down"],
      rest: 30,
      weeks: [{sets:2,reps:"8–10"},{sets:2,reps:"8–10"},{sets:3,reps:"8–10"},{sets:3,reps:"8–10"}]
    },
    {
      name: "Standing Barbell Overhead Press",
      note: "",
      cues: ["Bar on upper chest/front delts, not neck", "Grip just outside shoulder width", "Core tight, glutes squeezed throughout", "Press straight up, lock out at top"],
      rest: 45,
      weeks: [{sets:3,reps:"8"},{sets:4,reps:"8"},{sets:3,reps:"10"},{sets:4,reps:"10"}]
    },
    {
      name: "Overhead DB Tricep Extension",
      note: "Substitution for Tricep Pushdowns",
      cues: ["Hold one dumbbell with both hands behind head", "Elbows point forward, stay close to ears", "Extend arms fully overhead, squeeze triceps", "Lower under control back behind head"],
      rest: 30,
      weeks: [{sets:2,reps:"8–10"},{sets:2,reps:"10–12"},{sets:3,reps:"8–10"},{sets:3,reps:"10–12"}]
    },
    {
      name: "Jefferson Curls",
      note: "Tempo: 5 sec down · 2 sec pause · 5 sec up — go very light",
      cues: ["Stand on step, weight hanging", "Tuck chin, roll down vertebra by vertebra", "5 sec down, 2 sec pause at bottom", "5 sec up, rebuild spine from base"],
      rest: 30,
      weeks: [{sets:2,reps:"5"},{sets:2,reps:"5"},{sets:2,reps:"5"},{sets:2,reps:"5"}]
    }
  ],
  B: [
    {
      name: "Warm-Up",
      note: "5 mins brisk walking or light jog, then 1-2 light sets of first exercise at ~50%",
      cues: ["5 minutes brisk walking or light jog", "1-2 light sets of Deadlift at ~50% weight", "Get body temperature up — don't skip this"],
      rest: 0,
      weeks: [{sets:1,reps:"5 min"},{sets:1,reps:"5 min"},{sets:1,reps:"5 min"},{sets:1,reps:"5 min"}]
    },
    {
      name: "Barbell Deadlift",
      note: "",
      cues: ["Bar over mid-foot, about an inch from shins", "Big breath in, brace core before pulling", "Drive through floor, bar stays close to body", "Lock out hips and knees fully at top"],
      rest: 60,
      weeks: [{sets:2,reps:"5"},{sets:3,reps:"4"},{sets:3,reps:"5"},{sets:3,reps:"6"}]
    },
    {
      name: "Single Leg RDL",
      note: "Staggered stance — lead leg is primary weight-bearer",
      cues: ["Hold dumbbells in both hands, rear leg assists balance only", "Focus on pushing hips back — not bending down", "Feel strong stretch in lead leg hamstrings at bottom", "Do all reps each side — same count as programmed"],
      rest: 30,
      weeks: [{sets:2,reps:"8–10"},{sets:2,reps:"8–10"},{sets:3,reps:"8–10"},{sets:3,reps:"8–10"}]
    },
    {
      name: "Single Arm Dumbbell Row",
      note: "Non-dominant side first",
      cues: ["Knee and hand braced on bench", "Let weight hang straight from shoulder", "Pull to hip — not shoulder — lead with elbow", "Squeeze back at top, lower with control"],
      rest: 30,
      weeks: [{sets:3,reps:"8L/8R"},{sets:4,reps:"8L/8R"},{sets:3,reps:"10L/10R"},{sets:4,reps:"10L/10R"}]
    },
    {
      name: "Alternating DB Bicep Curls",
      note: "Substitution for EZ Bar Bicep Curls",
      cues: ["Hold a dumbbell in each hand, elbows pinned to sides", "Curl one arm at a time to shoulder height", "Squeeze at top, lower slowly before switching", "Don't swing or rock — strict form throughout"],
      rest: 30,
      weeks: [{sets:2,reps:"8–10"},{sets:2,reps:"10–12"},{sets:3,reps:"8–10"},{sets:3,reps:"10–12"}]
    },
    {
      name: "Standing Cable Twist",
      note: "Non-dominant side first",
      cues: ["Cable at chest height, stand side-on", "Both hands on handle, arms extended", "Rotate torso away — core drives the movement", "Control the return, don't let cable snap back"],
      rest: 30,
      weeks: [{sets:2,reps:"8L/8R"},{sets:2,reps:"8L/8R"},{sets:2,reps:"10L/10R"},{sets:2,reps:"10L/10R"}]
    }
  ]
};

// Week schedule: which workout is S1, S2, S3
const SCHEDULE = {
  1: ['A','B','A'],
  2: ['B','A','B'],
  3: ['A','B','A'],
  4: ['B','A','B']
};

// ─── STATE ────────────────────────────────────────────────────────
let currentWeek = 1;
let currentSession = 1; // 1, 2, or 3
let currentExIdx = 0;
let loads = [];
let setsDone = [];
let sessionStart = null;
let clockInterval = null;
let restInterval = null;

// ─── STORAGE ─────────────────────────────────────────────────────
function sKey(week, session) { return `ivan_s_w${week}_s${session}`; }
function lKey(week, session) { return `ivan_s_w${week}_s${session}_locked`; }

function saveSession() {
  try { localStorage.setItem(sKey(currentWeek, currentSession), JSON.stringify({loads, setsDone})); } catch(e) {}
}

function loadSessionData(week, session) {
  try {
    const d = localStorage.getItem(sKey(week, session));
    return d ? JSON.parse(d) : null;
  } catch(e) { return null; }
}

function isLocked(week, session) {
  try { return localStorage.getItem(lKey(week, session)) === 'true'; } catch(e) { return false; }
}

function lockSession(week, session) {
  try { localStorage.setItem(lKey(week, session), 'true'); } catch(e) {}
}

function unlockSession(week, session) {
  try { localStorage.removeItem(lKey(week, session)); } catch(e) {}
}

// ─── SEED WEEK 1 DATA ────────────────────────────────────────────
function seedWeek1() {
  // W1 S1 = Workout A — 06 Jun 2026
  if (!localStorage.getItem(sKey(1,1))) {
    localStorage.setItem(sKey(1,1), JSON.stringify({
      loads: ['','14','15','30','15','7.5'],
      setsDone: [0,2,2,3,2,2]
    }));
  }
  if (!localStorage.getItem(lKey(1,1))) lockSession(1,1);

  // W1 S2 = Workout B — 08 Jun 2026
  if (!localStorage.getItem(sKey(1,2))) {
    localStorage.setItem(sKey(1,2), JSON.stringify({
      loads: ['','35','0','16','10','12.5'],
      setsDone: [0,2,0,3,2,2]
    }));
  }
  if (!localStorage.getItem(lKey(1,2))) lockSession(1,2);

  // W1 S3 = Workout A — 13 Jun 2026
  if (!localStorage.getItem(sKey(1,3))) {
    localStorage.setItem(sKey(1,3), JSON.stringify({
      loads: ['','16','25','30','14','18'],
      setsDone: [0,2,2,3,2,2]
    }));
  }
  if (!localStorage.getItem(lKey(1,3))) lockSession(1,3);

  // Seed history if empty
  const hKey = 'ivan_history';
  if (!localStorage.getItem(hKey)) {
    const history = [
      {
        date:'06 Jun 2026', time:'13:06', endTime:'--', duration:0,
        week:1, session:1, workout:'A',
        loads:[
          {name:'Warm-Up',load:''},
          {name:'Dumbbell Goblet Squat',load:'14'},
          {name:'Knee Extensions',load:'15'},
          {name:'Standing Barbell Overhead Press',load:'30'},
          {name:'Overhead DB Tricep Extension',load:'15'},
          {name:'Jefferson Curls',load:'7.5'}
        ]
      },
      {
        date:'08 Jun 2026', time:'18:59', endTime:'19:29', duration:30,
        week:1, session:2, workout:'B',
        loads:[
          {name:'Warm-Up',load:''},
          {name:'Barbell Deadlift',load:'35'},
          {name:'Single Leg RDL',load:'0'},
          {name:'Single Arm Dumbbell Row',load:'16'},
          {name:'Alternating DB Bicep Curls',load:'10'},
          {name:'Standing Cable Twist',load:'12.5'}
        ]
      },
      {
        date:'13 Jun 2026', time:'14:03', endTime:'14:48', duration:45,
        week:1, session:3, workout:'A',
        loads:[
          {name:'Warm-Up',load:''},
          {name:'Dumbbell Goblet Squat',load:'16'},
          {name:'Knee Extensions',load:'25'},
          {name:'Standing Barbell Overhead Press',load:'30'},
          {name:'Overhead DB Tricep Extension',load:'14'},
          {name:'Jefferson Curls',load:'18'}
        ]
      }
    ];
    localStorage.setItem(hKey, JSON.stringify(history));
  }
}

// ─── HOME SCREEN ─────────────────────────────────────────────────
function selectWeek(w) {
  currentWeek = w;
  document.querySelectorAll('.week-btn').forEach((b,i) => b.classList.toggle('selected', i+1 === w));
  renderSessionButtons();
  renderHomeHistory();
}

function renderSessionButtons() {
  const schedule = SCHEDULE[currentWeek];
  const labels = ['Lower · Push', 'Hinge · Pull', 'Lower · Push'];
  const workoutLabels = { A: 'Lower · Push', B: 'Hinge · Pull' };
  const container = document.getElementById('session-buttons');
  container.innerHTML = schedule.map((workout, i) => {
    const sNum = i + 1;
    const locked = isLocked(currentWeek, sNum);
    return `<button class="session-btn s${sNum} ${locked ? 'locked' : ''}" onclick="startSession(${sNum})">
      ${sNum}
      <span class="s-label">${workoutLabels[workout]}</span>
      ${locked ? '<span class="s-done">✓ Done</span>' : ''}
    </button>`;
  }).join('');
}

function renderHomeHistory() {
  const container = document.getElementById('home-history-container');
  const schedule = SCHEDULE[currentWeek];
  let html = `<div class="home-history"><div class="home-history-title">Last logged loads — Week ${currentWeek}</div>`;
  let hasAny = false;

  schedule.forEach((workout, i) => {
    const sNum = i + 1;
    const data = loadSessionData(currentWeek, sNum);
    if (!data) return;
    const exercises = WORKOUTS[workout];
    const rows = exercises.map((ex, j) => {
      const load = data.loads[j];
      if (!load) return '';
      return `<div class="history-row"><span>${ex.name}</span><span>${load}kg</span></div>`;
    }).filter(Boolean).join('');
    if (!rows) return;
    hasAny = true;
    html += `<div class="history-section-label">Session ${sNum} (${workout})</div>${rows}`;
  });

  html += '</div>';
  container.innerHTML = hasAny ? html : '';
}

// ─── SESSION START ────────────────────────────────────────────────
function startSession(sNum) {
  currentSession = sNum;
  const workout = SCHEDULE[currentWeek][sNum - 1];

  if (isLocked(currentWeek, sNum)) {
    const unlock = confirm(`Session ${sNum} — Week ${currentWeek} is locked. Unlock to edit?`);
    if (!unlock) return;
    unlockSession(currentWeek, sNum);
  }

  const exercises = WORKOUTS[workout];
  const saved = loadSessionData(currentWeek, sNum);
  if (saved && saved.loads.length === exercises.length) {
    loads = saved.loads;
    setsDone = saved.setsDone;
  } else {
    loads = exercises.map(() => '');
    setsDone = exercises.map(() => 0);
  }

  currentExIdx = 0;
  sessionStart = null; // Timer starts on first "Start" tap, not here
  showScreen('exercise');
  renderExercise();
}

// ─── CLOCK ───────────────────────────────────────────────────────
function startClock() {
  if (sessionStart) return; // already started
  sessionStart = new Date();
  clearInterval(clockInterval);
  clockInterval = setInterval(() => {
    const elapsed = Math.floor((new Date() - sessionStart) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('session-clock').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

// ─── EXERCISE RENDER ─────────────────────────────────────────────
function renderExercise() {
  const workout = SCHEDULE[currentWeek][currentSession - 1];
  const exercises = WORKOUTS[workout];
  const ex = exercises[currentExIdx];
  const weekData = ex.weeks[currentWeek - 1];
  const total = exercises.length;
  const isWarmup = ex.rest === 0;

  document.getElementById('ex-num').textContent = currentExIdx + 1;
  document.getElementById('ex-total').textContent = total;
  document.getElementById('week-badge').textContent = `W${currentWeek} · S${currentSession}`;
  document.getElementById('progress-fill').style.width = `${(currentExIdx / total) * 100}%`;
  document.getElementById('prev-btn').style.opacity = currentExIdx === 0 ? '0.3' : '1';
  document.getElementById('next-btn').textContent = currentExIdx === total - 1 ? 'Finish ✓' : 'Next →';

  const setsHTML = isWarmup ? '' : Array.from({length: weekData.sets}, (_,i) =>
    `<div class="set-dot ${i < setsDone[currentExIdx] ? 'done' : ''}" onclick="toggleSet(${i})">${i+1}</div>`
  ).join('');

  const statsHTML = isWarmup ? '' : `
    <div class="stats-grid">
      <div class="stat-box hi"><div class="stat-value">${weekData.sets}</div><div class="stat-label">Sets</div></div>
      <div class="stat-box hi"><div class="stat-value" style="font-size:${weekData.reps.length > 3 ? '22px':'34px'}">${weekData.reps}</div><div class="stat-label">Reps</div></div>
      <div class="stat-box"><div class="stat-value">${ex.rest}s</div><div class="stat-label">Rest</div></div>
    </div>
    <div class="load-section">
      <div class="load-label">Load used (kg)</div>
      <input class="load-input" type="number" placeholder="— kg" value="${loads[currentExIdx] || ''}"
        oninput="loads[currentExIdx]=this.value;saveSession();" inputmode="decimal">
    </div>
    <div class="sets-section">
      <div class="sets-label">Sets completed</div>
      <div class="sets-row">${setsHTML}</div>
    </div>`;

  // Start button for warm-up to trigger clock
  const warmupBtn = isWarmup ? `
    <button onclick="startClock();this.textContent='⏱ Timer started';this.style.opacity='0.5';this.disabled=true;"
      style="width:100%;background:var(--accent);color:var(--bg);border:none;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;padding:16px;border-radius:10px;cursor:pointer;margin-top:16px;">
      Start Session
    </button>` : '';

  document.getElementById('ex-card').innerHTML = `
    <div class="ex-name">${ex.name}</div>
    <div class="ex-note">${ex.note || '&nbsp;'}</div>
    ${statsHTML}
    <div class="cues-section">
      <div class="cues-label">Form cues</div>
      <ul class="cues-list">${ex.cues.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
    ${warmupBtn}
  `;
}

// ─── SET TOGGLE ──────────────────────────────────────────────────
function toggleSet(i) {
  const workout = SCHEDULE[currentWeek][currentSession - 1];
  const ex = WORKOUTS[workout][currentExIdx];
  const weekData = ex.weeks[currentWeek - 1];
  if (i < setsDone[currentExIdx]) {
    setsDone[currentExIdx] = i;
  } else {
    setsDone[currentExIdx] = i + 1;
    if (i + 1 < weekData.sets) {
      startRest(ex.rest, `Set ${i+2} of ${weekData.sets} up next`);
    }
  }
  saveSession();
  renderExercise();
}

// ─── REST TIMER ──────────────────────────────────────────────────
function startRest(seconds, subtitle) {
  let remaining = seconds;
  document.getElementById('rest-timer').textContent = remaining;
  document.getElementById('rest-sub').textContent = subtitle;
  document.getElementById('rest-overlay').classList.add('active');
  clearInterval(restInterval);
  restInterval = setInterval(() => {
    remaining--;
    document.getElementById('rest-timer').textContent = remaining;
    if (remaining <= 0) skipRest();
  }, 1000);
}

function skipRest() {
  clearInterval(restInterval);
  document.getElementById('rest-overlay').classList.remove('active');
}

// ─── NAVIGATION ──────────────────────────────────────────────────
function nextEx() {
  const workout = SCHEDULE[currentWeek][currentSession - 1];
  const exercises = WORKOUTS[workout];
  if (currentExIdx < exercises.length - 1) {
    const ex = exercises[currentExIdx];
    if (ex.rest > 0) startRest(ex.rest, `Next: ${exercises[currentExIdx+1].name}`);
    currentExIdx++;
    renderExercise();
  } else {
    finishSession();
  }
}

function prevEx() {
  if (currentExIdx > 0) { currentExIdx--; renderExercise(); }
}

function finishSession() {
  clearInterval(clockInterval);
  clearInterval(restInterval);
  document.getElementById('rest-overlay').classList.remove('active');

  const end = new Date();
  const start = sessionStart || end;
  const duration = Math.round((end - start) / 60000);
  const fmt = d => d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  saveSession();
  lockSession(currentWeek, currentSession);
  saveHistory(fmt(start), fmt(end), duration);

  document.getElementById('done-times').innerHTML = `
    <div class="done-time-box"><div class="done-time-val">${fmt(start)}</div><div class="done-time-label">Start</div></div>
    <div class="done-time-box"><div class="done-time-val">${fmt(end)}</div><div class="done-time-label">End</div></div>
    <div class="done-time-box"><div class="done-time-val">${duration}m</div><div class="done-time-label">Duration</div></div>`;

  showScreen('done');
}

function goHome() {
  clearInterval(clockInterval);
  clearInterval(restInterval);
  sessionStart = null;
  document.getElementById('rest-overlay').classList.remove('active');
  document.getElementById('session-clock').textContent = '0:00';
  renderSessionButtons();
  renderHomeHistory();
  showScreen('home');
}

// ─── HISTORY ─────────────────────────────────────────────────────
function saveHistory(timeStart, timeEnd, duration) {
  const workout = SCHEDULE[currentWeek][currentSession - 1];
  const exercises = WORKOUTS[workout];
  const entry = {
    date: new Date().toLocaleDateString('en-IE', {day:'2-digit', month:'short', year:'numeric'}),
    time: timeStart, endTime: timeEnd, duration,
    week: currentWeek, session: currentSession, workout,
    loads: exercises.map((ex,i) => ({name: ex.name, load: loads[i] || ''}))
  };
  try {
    const history = JSON.parse(localStorage.getItem('ivan_history') || '[]');
    history.push(entry);
    localStorage.setItem('ivan_history', JSON.stringify(history));
  } catch(e) {}
}

function showHistory() {
  try {
    const history = JSON.parse(localStorage.getItem('ivan_history') || '[]');
    const container = document.getElementById('history-content');
    if (!history.length) {
      container.innerHTML = '<p style="color:var(--muted);padding:24px;font-size:14px;">No sessions logged yet.</p>';
    } else {
      container.innerHTML = [...history].reverse().map(e => {
        const rows = e.loads.filter(l => l.load).map(l =>
          `<div class="history-load-row"><span>${l.name}</span><span>${l.load}kg</span></div>`
        ).join('');
        return `<div class="history-entry">
          <div class="history-entry-header">
            <div>
              <div class="history-entry-title">Week ${e.week} · Session ${e.session} (${e.workout})</div>
              <div class="history-entry-meta">${e.date} · ${e.time}–${e.endTime} · ${e.duration}min</div>
            </div>
            <div class="history-badge">W${e.week}S${e.session}</div>
          </div>
          ${rows}
        </div>`;
      }).join('');
    }
  } catch(e) {}
  showScreen('history');
}

// ─── SCREEN MANAGEMENT ───────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ─── INIT ────────────────────────────────────────────────────────
function init() {
  seedWeek1();
  renderSessionButtons();
  renderHomeHistory();
}

window.addEventListener('load', init);
</script>

<script>
// Unregister any old service workers
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}
</script>

</body>
</html>

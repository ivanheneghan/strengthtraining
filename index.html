<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ivan's Programme</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Strength">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --accent: #e8ff47;
    --accent-dim: #b8cc38;
    --text: #f0f0f0;
    --muted: #666;
    --danger: #ff4747;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCREENS */
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* HOME SCREEN */
  #home {
    padding: 48px 24px 32px;
    justify-content: space-between;
  }

  .home-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    line-height: 0.9;
    letter-spacing: 2px;
    color: var(--text);
  }

  .home-header h1 span { color: var(--accent); }

  .home-header p {
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .week-selector {
    margin-top: 40px;
  }

  .week-selector label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .week-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .week-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    padding: 16px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .week-btn.selected {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .workout-buttons {
    margin-top: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .workout-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    padding: 28px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .workout-btn::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transition: transform 0.2s;
  }

  .workout-btn:active::after { transform: scaleX(1); }

  .workout-btn span {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  .workout-btn.a-btn { border-top: 3px solid var(--accent); }
  .workout-btn.b-btn { border-top: 3px solid #47b8ff; }

  /* EXERCISE SCREEN */
  #exercise {
    padding: 0;
    position: relative;
  }

  .ex-header {
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .ex-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ex-progress-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .ex-progress-label strong {
    color: var(--accent);
    font-weight: 500;
  }

  .week-badge {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  /* Progress bar */
  .progress-bar {
    height: 2px;
    background: var(--border);
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  /* Exercise card */
  .ex-card {
    padding: 32px 24px 24px;
    flex: 1;
  }

  .ex-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    line-height: 0.95;
    letter-spacing: 1px;
    color: var(--text);
    margin-bottom: 8px;
  }

  .ex-note {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    font-style: italic;
    margin-bottom: 28px;
    min-height: 16px;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }

  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
  }

  .stat-box.highlight {
    background: var(--accent);
    border-color: var(--accent);
  }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 1px;
    color: var(--text);
    line-height: 1;
  }

  .stat-box.highlight .stat-value { color: var(--bg); }

  .stat-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  .stat-box.highlight .stat-label { color: rgba(0,0,0,0.5); }

  /* Form cues */
  .cues-section {
    margin-bottom: 28px;
  }

  .cues-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .cues-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .cues-list li {
    font-size: 14px;
    font-weight: 300;
    color: var(--text);
    padding-left: 16px;
    position: relative;
    line-height: 1.5;
  }

  .cues-list li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-size: 12px;
  }

  /* Set tracker */
  .sets-section {
    margin-bottom: 32px;
  }

  .sets-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .sets-row {
    display: flex;
    gap: 10px;
  }

  .set-dot {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--muted);
    transition: all 0.15s;
  }

  .set-dot.done {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  /* Load field */
  .load-section {
    margin-bottom: 32px;
  }

  .load-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .load-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    padding: 14px 16px;
    border-radius: 10px;
    width: 100%;
    outline: none;
    letter-spacing: 1px;
  }

  .load-input:focus { border-color: var(--accent); }
  .load-input::placeholder { color: var(--muted); }

  /* Navigation */
  .ex-nav {
    padding: 16px 24px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    bottom: 0;
  }

  .nav-btn {
    padding: 18px;
    border-radius: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .prev-btn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .next-btn {
    background: var(--accent);
    color: var(--bg);
  }

  .next-btn:disabled {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    cursor: default;
  }

  /* DONE SCREEN */
  #done {
    padding: 48px 24px;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 20px;
  }

  .done-icon {
    font-size: 64px;
    line-height: 1;
  }

  .done-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    line-height: 0.9;
    letter-spacing: 2px;
  }

  .done-title span { color: var(--accent); }

  .done-sub {
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
    max-width: 280px;
    line-height: 1.6;
  }

  .done-home-btn {
    margin-top: 16px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    padding: 18px 40px;
    border-radius: 12px;
    cursor: pointer;
  }

  /* REST TIMER OVERLAY */
  .rest-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .rest-overlay.active { display: flex; }

  .rest-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rest-timer {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 120px;
    color: var(--accent);
    line-height: 1;
    letter-spacing: 4px;
  }

  .rest-subtitle {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
  }

  .rest-skip {
    margin-top: 20px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 12px 28px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <div>
    <div class="home-header">
      <h1>FOUNDATIONAL<br><span>STRENGTH</span></h1>
      <p>Ivan Heneghan · Programme 1</p>
    </div>

    <div class="week-selector">
      <label>Select Week</label>
      <div class="week-grid">
        <button class="week-btn selected" onclick="selectWeek(1)">1</button>
        <button class="week-btn" onclick="selectWeek(2)">2</button>
        <button class="week-btn" onclick="selectWeek(3)">3</button>
        <button class="week-btn" onclick="selectWeek(4)">4</button>
      </div>
    </div>

    <div style="margin-top:20px;"><button onclick="showHistory()" style="width:100%;background:none;border:1px solid var(--border);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:12px;border-radius:8px;cursor:pointer;">View Session History</button></div>
    <div class="workout-buttons">
      <button class="workout-btn a-btn" onclick="startWorkout('A')" id="btn-A">
        A
        <span>Lower · Push</span>
      </button>
      <button class="workout-btn b-btn" onclick="startWorkout('B')" id="btn-B">
        B
        <span>Hinge · Pull</span>
      </button>
      <button class="workout-btn" id="btn-C" onclick="startWorkoutC()" style="border-top:3px solid #b847ff;">
        C
        <span id="c-label"></span>
      </button>
    </div>
  </div>
</div>

<!-- EXERCISE -->
<div class="screen" id="exercise">
  <div class="ex-header">
    <div class="ex-header-left">
      <button class="back-btn" onclick="goHome()">←</button>
      <div class="ex-progress-label">
        <strong id="ex-current">1</strong> / <span id="ex-total">5</span>
      </div>
    </div>
    <div class="week-badge" id="week-badge">Week 1</div>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="ex-card" id="ex-card">
    <!-- populated by JS -->
  </div>

  <div class="ex-nav">
    <button class="nav-btn prev-btn" id="prev-btn" onclick="prevExercise()">← Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="nextExercise()">Next →</button>
  </div>
</div>

<!-- DONE -->
<div class="screen" id="done">
  <div class="done-icon">💪</div>
  <div class="done-title">WORKOUT<br><span>DONE.</span></div>
  <p class="done-sub">Note your loads before you leave. You'll need them next session.</p>
  <div id="done-time-info" style="width:100%;max-width:360px;"></div>
  <button class="done-home-btn" onclick="goHome()">Back to Home</button>
</div>

<!-- HISTORY SCREEN -->
<div class="screen" id="history">
  <div class="ex-header">
    <div class="ex-header-left">
      <button class="back-btn" onclick="goHome()">←</button>
      <div class="ex-progress-label" style="color:var(--text);font-size:14px;font-weight:500;">Session History</div>
    </div>
  </div>
  <div style="padding:24px;" id="history-content"></div>
</div>

<!-- REST TIMER OVERLAY -->
<div class="rest-overlay" id="rest-overlay">
  <div class="rest-label">Rest</div>
  <div class="rest-timer" id="rest-timer">—</div>
  <div class="rest-subtitle" id="rest-subtitle"></div>
  <button class="rest-skip" onclick="skipRest()">Skip Rest</button>
</div>

<script>

const PROGRAMME = {
  A: [
    {
      name: "Warm-Up",
      note: "5 mins brisk walking or light jogging",
      cues: ["5 minutes brisk walking or light jog", "Then 1-2 light sets of your first exercise at ~50% of working weight", "Get the body temperature up — don't skip this"],
      rest: 0,
      weeks: [
        { sets: 1, reps: "5 min" },
        { sets: 1, reps: "5 min" },
        { sets: 1, reps: "5 min" },
        { sets: 1, reps: "5 min" }
      ]
    },
    {
      name: "Dumbbell Goblet Squat",
      note: "Start non-dominant side first for unilateral moves",
      cues: ["Hold dumbbell vertically at chest, hands cupped", "Feet shoulder-width, toes out slightly", "Knees track over toes — don't cave in", "Chest tall, heels on floor throughout"],
      rest: 60,
      weeks: [
        { sets: 2, reps: "10" },
        { sets: 2, reps: "12" },
        { sets: 3, reps: "8" },
        { sets: 3, reps: "10" }
      ]
    },
    {
      name: "Knee Extensions",
      note: "",
      cues: ["Pad sits just above ankle", "Knee joint aligned with machine pivot", "Extend fully at top, lower slowly", "Don't let weight crash down"],
      rest: 30,
      weeks: [
        { sets: 2, reps: "8–10" },
        { sets: 2, reps: "8–10" },
        { sets: 3, reps: "8–10" },
        { sets: 3, reps: "8–10" }
      ]
    },
    {
      name: "Standing Barbell Overhead Press",
      note: "Tempo: controlled up and down",
      cues: ["Bar on upper chest/front delts, not neck", "Grip just outside shoulder width", "Core tight, glutes squeezed throughout", "Press straight up, lock out at top"],
      rest: 45,
      weeks: [
        { sets: 3, reps: "8" },
        { sets: 4, reps: "8" },
        { sets: 3, reps: "10" },
        { sets: 4, reps: "10" }
      ]
    },
    {
      name: "Tricep Pushdowns",
      note: "",
      cues: ["Straight bar or rope attachment", "Elbows pinned to sides — they don't move", "Full extension at bottom, squeeze", "Control the weight back up"],
      rest: 30,
      weeks: [
        { sets: 2, reps: "8–10" },
        { sets: 2, reps: "10–12" },
        { sets: 3, reps: "8–10" },
        { sets: 3, reps: "10–12" }
      ]
    },
    {
      name: "Jefferson Curls",
      note: "Tempo: 5 sec down · 2 sec pause · 5 sec up — go very light",
      cues: ["Stand on step/platform, weight hanging", "Tuck chin, roll down vertebra by vertebra", "5 sec down, 2 sec pause at bottom", "5 sec up, rebuild spine from base"],
      rest: 30,
      weeks: [
        { sets: 2, reps: "5" },
        { sets: 2, reps: "5" },
        { sets: 2, reps: "5" },
        { sets: 2, reps: "5" }
      ]
    }
  ],
  B: [
    {
      name: "Warm-Up",
      note: "5 mins brisk walking or light jogging",
      cues: ["5 minutes brisk walking or light jog", "Then 1-2 light sets of your first exercise at ~50% of working weight", "Get the body temperature up — don't skip this"],
      rest: 0,
      weeks: [
        { sets: 1, reps: "5 min" },
        { sets: 1, reps: "5 min" },
        { sets: 1, reps: "5 min" },
        { sets: 1, reps: "5 min" }
      ]
    },
    {
      name: "Barbell Deadlift",
      note: "",
      cues: ["Bar over mid-foot, about an inch from shins", "Big breath in, brace core before pulling", "Drive through floor, bar stays close to body", "Lock out hips and knees fully at top"],
      rest: 60,
      weeks: [
        { sets: 2, reps: "5" },
        { sets: 3, reps: "4" },
        { sets: 3, reps: "5" },
        { sets: 3, reps: "6" }
      ]
    },
    {
      name: "Single Leg RDL",
      note: "Staggered stance — lead leg is primary weight-bearer",
      cues: ["Hold dumbbells in both hands, rear leg assists balance only", "Focus on pushing hips back — not bending down", "Feel strong stretch in lead leg hamstrings at bottom", "Do all reps each side — same count as hamstring curls"],
      rest: 30,
      weeks: [
        { sets: 2, reps: "8–10" },
        { sets: 2, reps: "8–10" },
        { sets: 3, reps: "8–10" },
        { sets: 3, reps: "8–10" }
      ]
    },
    {
      name: "Single Arm Dumbbell Row",
      note: "Non-dominant side first",
      cues: ["Knee and hand braced on bench", "Let weight hang straight from shoulder", "Pull to hip — not shoulder — lead with elbow", "Squeeze back at top, lower with control"],
      rest: 30,
      weeks: [
        { sets: 3, reps: "8L / 8R" },
        { sets: 4, reps: "8L / 8R" },
        { sets: 3, reps: "10L / 10R" },
        { sets: 4, reps: "10L / 10R" }
      ]
    },
    {
      name: "Alternating DB Bicep Curls",
      note: "Substitution for EZ Bar Bicep Curls",
      cues: ["Hold a dumbbell in each hand, elbows pinned to sides", "Curl one arm at a time to shoulder height, squeeze at top", "Lower slowly before curling the other arm", "Don't swing or rock — strict form throughout"],
      rest: 30,
      weeks: [
        { sets: 2, reps: "8–10" },
        { sets: 2, reps: "10–12" },
        { sets: 3, reps: "8–10" },
        { sets: 3, reps: "10–12" }
      ]
    },
    {
      name: "Standing Cable Twist",
      note: "Non-dominant side first",
      cues: ["Cable at chest height, stand side-on", "Both hands on handle, arms extended", "Rotate torso away — core drives the movement", "Control the return, don't let cable snap back"],
      rest: 30,
      weeks: [
        { sets: 2, reps: "8L / 8R" },
        { sets: 2, reps: "8L / 8R" },
        { sets: 2, reps: "10L / 10R" },
        { sets: 2, reps: "10L / 10R" }
      ]
    }
  ]
};

let currentWeek = 1;
let currentWorkout = 'A';
let currentIndex = 0;
let setsDone = [];
let loads = [];
let restInterval = null;
let sessionStart = null;
let sessionEnd = null;
let currentSlot = null;

function storageKey(week, workout, slot) {
  return `ivan_prog1_w${week}_${slot || workout}`;
}

function saveSession() {
  const key = storageKey(currentWeek, currentWorkout, currentSlot);
  try { localStorage.setItem(key, JSON.stringify({ loads, setsDone })); } catch(e) {}
}

function saveHistory() {
  const exercises = PROGRAMME[currentWorkout];
  const entry = {
    date: new Date().toLocaleDateString('en-IE', {day:'2-digit', month:'short', year:'numeric'}),
    time: sessionStart ? sessionStart.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '--',
    endTime: sessionEnd ? sessionEnd.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '--',
    duration: sessionStart && sessionEnd ? Math.round((sessionEnd - sessionStart) / 60000) : 0,
    week: currentWeek,
    workout: currentWorkout,
    loads: exercises.map((ex, i) => ({ name: ex.name, load: loads[i] || '' }))
  };
  try {
    const existing = JSON.parse(localStorage.getItem('ivan_prog1_history') || '[]');
    existing.push(entry);
    localStorage.setItem('ivan_prog1_history', JSON.stringify(existing));
  } catch(e) {}
}

function loadSession(week, workout) {
  try {
    const saved = localStorage.getItem(storageKey(week, workout));
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return null;
}

function updateLockBadges() {
  ['A','B','C'].forEach(type => {
    const btn = document.getElementById(`btn-${type}`);
    if (!btn) return;
    const locked = isLocked(currentWeek, type, type);
    btn.style.opacity = locked ? '0.6' : '1';
    const existing = btn.querySelector('.lock-badge');
    if (existing) existing.remove();
    if (locked) {
      const badge = document.createElement('div');
      badge.className = 'lock-badge';
      badge.style.cssText = 'font-size:11px;letter-spacing:1px;color:var(--accent);margin-top:4px;';
      badge.textContent = '✓ DONE';
      btn.appendChild(badge);
    }
  });
}

function renderHomeHistory() {
  const existing = document.getElementById('home-history');
  if (existing) existing.remove();
  const savedA = loadSession(currentWeek, 'A');
  const savedB = loadSession(currentWeek, 'B');
  updateLockBadges();
  if (!savedA && !savedB) return;

  const div = document.createElement('div');
  div.id = 'home-history';
  div.style.cssText = 'margin-top:32px;';
  div.innerHTML = `<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Last logged loads — Week ${currentWeek}</div>`;

  ['A','B'].forEach(type => {
    const saved = loadSession(currentWeek, type);
    if (!saved) return;
    const exercises = PROGRAMME[type];
    const hasLoads = saved.loads.some(l => l !== '');
    if (!hasLoads) return;
    let rows = exercises.map((ex, i) => {
      const load = saved.loads[i];
      if (!load) return '';
      return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <span style="color:var(--muted);font-weight:300;">${ex.name}</span>
        <span style="color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:16px;">${load}kg</span>
      </div>`;
    }).join('');
    if (!rows.trim()) return;
    div.innerHTML += `<div style="margin-bottom:16px;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:1px;">Workout ${type}</div>${rows}</div>`;
  });

  document.querySelector('.workout-buttons').after(div);
  updateLockBadges();
}

function getCWorkout(week) {
  return week % 2 === 1 ? 'A' : 'B';
}

function updateCLabel() {
  const cWorkout = getCWorkout(currentWeek);
  const label = document.getElementById('c-label');
  if (label) label.textContent = cWorkout === 'A' ? 'Lower · Push' : 'Hinge · Pull';
  const btnC = document.getElementById('btn-C');
  if (btnC) btnC.style.borderTopColor = cWorkout === 'A' ? '#e8ff47' : '#47b8ff';
}

function startWorkoutC() {
  startWorkout(getCWorkout(currentWeek), 'C');
}

function selectWeek(w) {
  currentWeek = w;
  document.querySelectorAll('.week-btn').forEach((b, i) => {
    b.classList.toggle('selected', i + 1 === w);
  });
  updateCLabel();
  renderHomeHistory();
}

function startWorkout(type, slot) {
  currentSlot = slot || type;
  currentWorkout = type;
  currentIndex = 0;
  const exercises = PROGRAMME[type];
  const saved = loadSession(currentWeek, type, currentSlot);
  if (saved && saved.loads.length === exercises.length) {
    loads = saved.loads;
    setsDone = saved.setsDone;
  } else {
    loads = exercises.map(() => '');
    setsDone = exercises.map(() => 0);
  }
  if (isLocked(currentWeek, type, currentSlot)) {
    const slotLabel = currentSlot === 'C' ? `C (Workout ${type})` : type;
    const unlock = confirm(`Workout ${slotLabel} — Week ${currentWeek} is locked (completed). Unlock to edit?`);
    if (unlock) {
      unlockSession(currentWeek, type, currentSlot);
    } else {
      return;
    }
  }
  sessionStart = new Date();
  sessionEnd = null;
  showScreen('exercise');
  renderExercise();
}

function renderExercise() {
  const exercises = PROGRAMME[currentWorkout];
  const ex = exercises[currentIndex];
  const weekData = ex.weeks[currentWeek - 1];
  const total = exercises.length;

  document.getElementById('ex-current').textContent = currentIndex + 1;
  document.getElementById('ex-total').textContent = total;
  document.getElementById('week-badge').textContent = `Week ${currentWeek}`;
  document.getElementById('progress-fill').style.width = `${((currentIndex) / total) * 100}%`;

  // Sets dots
  const setsHTML = Array.from({length: weekData.sets}, (_, i) =>
    `<div class="set-dot ${i < setsDone[currentIndex] ? 'done' : ''}" onclick="toggleSet(${i})">${i + 1}</div>`
  ).join('');

  const statsHTML = ex.rest === 0 ? '' : `
    <div class="stats-grid">
      <div class="stat-box highlight">
        <div class="stat-value">${weekData.sets}</div>
        <div class="stat-label">Sets</div>
      </div>
      <div class="stat-box highlight">
        <div class="stat-value" style="font-size:${weekData.reps.length > 3 ? '22px' : '36px'}">${weekData.reps}</div>
        <div class="stat-label">Reps</div>
      </div>
      <div class="stat-box">
        <div class="stat-value">${ex.rest}s</div>
        <div class="stat-label">Rest</div>
      </div>
    </div>`;

  const trackerHTML = ex.rest === 0 ? '' : `
    <div class="load-section">
      <div class="load-label">Load used (kg)</div>
      <input class="load-input" type="number" placeholder="— kg" value="${loads[currentIndex]}"
        oninput="loads[currentIndex] = this.value; saveSession();" inputmode="decimal">
    </div>
    <div class="sets-section">
      <div class="sets-label">Sets completed</div>
      <div class="sets-row">${setsHTML}</div>
    </div>`;

  document.getElementById('ex-card').innerHTML = `
    <div class="ex-name">${ex.name}</div>
    <div class="ex-note">${ex.note || '&nbsp;'}</div>
    ${statsHTML}
    <div class="cues-section">
      <div class="cues-label">Form cues</div>
      <ul class="cues-list">
        ${ex.cues.map(c => `<li>${c}</li>`).join('')}
      </ul>
    </div>
    ${trackerHTML}
  `;

  document.getElementById('prev-btn').style.opacity = currentIndex === 0 ? '0.3' : '1';
  document.getElementById('next-btn').textContent = currentIndex === total - 1 ? 'Finish ✓' : 'Next →';
}

function toggleSet(i) {
  const ex = PROGRAMME[currentWorkout][currentIndex];
  const weekData = ex.weeks[currentWeek - 1];

  if (i < setsDone[currentIndex]) {
    setsDone[currentIndex] = i;
  } else {
    setsDone[currentIndex] = i + 1;
    // Show rest timer if not last set
    if (i + 1 < weekData.sets) {
      startRest(ex.rest, `Set ${i + 2} of ${weekData.sets} up next`);
    }
  }
  renderExercise();
}

function startRest(seconds, subtitle) {
  const overlay = document.getElementById('rest-overlay');
  const timerEl = document.getElementById('rest-timer');
  const subEl = document.getElementById('rest-subtitle');

  let remaining = seconds;
  subEl.textContent = subtitle;
  timerEl.textContent = remaining;
  overlay.classList.add('active');

  clearInterval(restInterval);
  restInterval = setInterval(() => {
    remaining--;
    timerEl.textContent = remaining;
    if (remaining <= 0) {
      skipRest();
    }
  }, 1000);
}

function skipRest() {
  clearInterval(restInterval);
  document.getElementById('rest-overlay').classList.remove('active');
}

function nextExercise() {
  const exercises = PROGRAMME[currentWorkout];
  if (currentIndex < exercises.length - 1) {
    // Show rest between exercises
    const ex = exercises[currentIndex];
    currentIndex++;
    startRest(ex.rest, `Next: ${exercises[currentIndex].name}`);
    renderExercise();
  } else {
    saveSession(); sessionEnd = new Date(); saveHistory(); lockSession(currentWeek, currentWorkout, currentSlot); showScreen('done'); renderDoneScreen();
  }
}

function prevExercise() {
  if (currentIndex > 0) {
    currentIndex--;
    renderExercise();
  }
}

function goHome() {
  saveSession();
  clearInterval(restInterval);
  document.getElementById('rest-overlay').classList.remove('active');
  showScreen('home');
}



function lockKey(week, workout, slot) {
  return `ivan_prog1_w${week}_${slot || workout}_locked`;
}

function isLocked(week, workout) {
  try { return localStorage.getItem(lockKey(week, workout)) === 'true'; } catch(e) { return false; }
}

function lockSession(week, workout) {
  try { localStorage.setItem(lockKey(week, workout), 'true'); } catch(e) {}
}

function unlockSession(week, workout) {
  try { localStorage.removeItem(lockKey(week, workout)); } catch(e) {}
}

function migrateExistingData() {
  try {
    const history = JSON.parse(localStorage.getItem('ivan_prog1_history') || '[]');
    
    // Check all possible week/workout combinations
    const workouts = ['A', 'B'];
    const weeks = [1, 2, 3, 4];
    let migrated = false;

    weeks.forEach(week => {
      workouts.forEach(workout => {
        const key = `ivan_prog1_w${week}_${workout}`;
        const saved = localStorage.getItem(key);
        if (!saved) return;

        // Check if already migrated
        const alreadyLogged = history.some(e => e.week === week && e.workout === workout && e.migrated);
        if (alreadyLogged) return;

        const data = JSON.parse(saved);
        const hasLoads = data.loads && data.loads.some(l => l !== '');
        if (!hasLoads) return;

        const exercises = PROGRAMME[workout];
        const entry = {
          date: new Date().toLocaleDateString('en-IE', {day:'2-digit', month:'short', year:'numeric'}),
          time: '--',
          endTime: '--',
          duration: 0,
          week: week,
          workout: workout,
          migrated: true,
          loads: exercises.map((ex, i) => ({ name: ex.name, load: data.loads[i] || '' }))
        };
        history.push(entry);
        migrated = true;
      });
    });

    if (migrated) {
      localStorage.setItem('ivan_prog1_history', JSON.stringify(history));
    }
  } catch(e) {}
}

function init() { migrateExistingData(); renderHomeHistory(); updateCLabel(); }
window.addEventListener("load", init);


function renderDoneScreen() {
  const fmt = (d) => d ? d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
  const duration = sessionStart && sessionEnd ? Math.round((sessionEnd - sessionStart) / 60000) : 0;
  const timeInfo = document.getElementById('done-time-info');
  if (timeInfo) {
    timeInfo.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px;">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);">${fmt(sessionStart)}</div>
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:4px;">Start</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);">${fmt(sessionEnd)}</div>
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:4px;">End</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);">${duration}m</div>
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:4px;">Duration</div>
        </div>
      </div>`;
  }
}


function showHistory() {
  try {
    const history = JSON.parse(localStorage.getItem('ivan_prog1_history') || '[]');
    const container = document.getElementById('history-content');
    if (!history.length) {
      container.innerHTML = '<p style="color:var(--muted);font-size:14px;">No sessions logged yet.</p>';
    } else {
      const reversed = [...history].reverse();
      container.innerHTML = reversed.map(entry => `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;">Workout ${entry.slot || entry.workout} — Week ${entry.week}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">${entry.date} · ${entry.time}–${entry.endTime} · ${entry.duration}min</div>
            </div>
            <div style="background:var(--accent);color:var(--bg);font-family:'Bebas Neue',sans-serif;font-size:18px;padding:6px 12px;border-radius:6px;">W${entry.week}${entry.workout}</div>
          </div>
          ${entry.loads.filter(l => l.load).map(l => `
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
              <span style="color:var(--muted);font-weight:300;">${l.name}</span>
              <span style="color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:16px;">${l.load}kg</span>
            </div>`).join('')}
        </div>`).join('');
    }
  } catch(e) {
    document.getElementById('history-content').innerHTML = '<p style="color:var(--muted);">Could not load history.</p>';
  }
  showScreen('history');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
</script>

<script>
// Pre-seed W1A session data from first session
(function() {
  try {
    const historyKey = 'ivan_prog1_history';
    const sessionKey = 'ivan_prog1_w1_A';
    const lockKey = 'ivan_prog1_w1_A_locked';

    // Only seed if not already present
    if (!localStorage.getItem(sessionKey)) {
      const loads = ['14', '15', '30', '15', '7.5'];
      // 6 items including warmup
      const allLoads = ['', ...loads];
      const setsDone = [0, 2, 2, 3, 2, 2];
      localStorage.setItem(sessionKey, JSON.stringify({ loads: allLoads, setsDone }));
    }

    if (!localStorage.getItem(lockKey)) {
      localStorage.setItem(lockKey, 'true');
    }

    const existing = JSON.parse(localStorage.getItem(historyKey) || '[]');
    const alreadyLogged = existing.some(e => e.week === 1 && e.workout === 'A');
    if (!alreadyLogged) {
      existing.push({
        date: '06 Jun 2026',
        time: '13:06',
        endTime: '--',
        duration: 0,
        week: 1,
        workout: 'A',
        migrated: true,
        loads: [
          { name: 'Warm-Up', load: '' },
          { name: 'Dumbbell Goblet Squat', load: '14' },
          { name: 'Knee Extensions', load: '15' },
          { name: 'Standing Barbell Overhead Press', load: '30' },
          { name: 'Tricep Pushdowns', load: '15' },
          { name: 'Jefferson Curls', load: '7.5' }
        ]
      });
      localStorage.setItem(historyKey, JSON.stringify(existing));
    }
  } catch(e) {}
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(err => console.log('SW registration failed:', err));
  });
}
</script>
